<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fullstacktics</title>
    <meta
      name="description"
      content="A gruvbox-themed static microsite that cycles optimized Fibonacci sequence implementations across 18 programming languages."
    >
    <meta name="theme-color" content="#1d2021">
    <link rel="preload" href="assets/fonts/IntelOneMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="background" aria-hidden="true"></div>
    <main class="shell">
      <header class="masthead">
        <div class="theme-switcher" role="group" aria-label="Color theme">
          <button
            class="theme-button"
            type="button"
            data-theme-value="light"
            aria-label="Switch to light mode"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 4.5V2m0 20v-2.5m7.5-7.5H22M2 12h2.5m12.803 5.303 1.768 1.768M4.929 4.929l1.768 1.768m10.606-1.768-1.768 1.768M6.697 17.303l-1.768 1.768M12 7.25A4.75 4.75 0 1 1 7.25 12 4.755 4.755 0 0 1 12 7.25Z"
              />
            </svg>
          </button>
          <button
            class="theme-button"
            type="button"
            data-theme-value="dark"
            aria-label="Switch to dark mode"
            aria-pressed="true"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.742 14.045A8.75 8.75 0 0 1 9.955 3.258a.75.75 0 0 0-.86-.95A10 10 0 1 0 21.692 14.9a.75.75 0 0 0-.95-.86Z"
              />
            </svg>
          </button>
        </div>
        <h1>fullstacktics</h1>
        <p class="tagline">iterative pair-update fibonacci sequence across 18 languages</p>
      </header>

      <section class="viewer" aria-labelledby="snippet-title">
        <div class="viewer-header">
          <div>
            <p class="eyebrow">code view</p>
            <h2 id="snippet-title">
              <span id="active-language">Rust</span>
              <span class="algorithm-chip">O(n) sequence printer</span>
            </h2>
          </div>
          <p class="viewer-status" id="viewer-status" aria-live="polite">auto cycling</p>
        </div>

        <div class="toolbar-wrap">
          <ul class="language-strip" id="language-strip" aria-label="Programming languages"></ul>
        </div>

        <div class="code-shell" id="code-shell">
          <pre class="code-block language-rust" tabindex="0"><code id="code-snippet" class="language-rust"></code></pre>
        </div>
      </section>
    </main>

    <script src="assets/prism/prism-core.min.js"></script>
    <script src="assets/prism/prism-clike.min.js"></script>
    <script src="assets/prism/prism-c.min.js"></script>
    <script src="assets/prism/prism-cpp.min.js"></script>
    <script src="assets/prism/prism-rust.min.js"></script>
    <script src="assets/prism/prism-go.min.js"></script>
    <script src="assets/prism/prism-haskell.min.js"></script>
    <script src="assets/prism/prism-swift.min.js"></script>
    <script src="assets/prism/prism-javascript.min.js"></script>
    <script src="assets/prism/prism-python.min.js"></script>
    <script src="assets/prism/prism-ruby.min.js"></script>
    <script src="assets/prism/prism-java.min.js"></script>
    <script src="assets/prism/prism-scala.min.js"></script>
    <script src="assets/prism/prism-groovy.min.js"></script>
    <script src="assets/prism/prism-kotlin.min.js"></script>
    <script src="assets/prism/prism-csharp.min.js"></script>
    <script src="assets/prism/prism-elixir.min.js"></script>
    <script src="assets/prism/prism-ocaml.min.js"></script>
    <script src="assets/prism/prism-julia.min.js"></script>
    <script src="assets/prism/prism-zig.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
